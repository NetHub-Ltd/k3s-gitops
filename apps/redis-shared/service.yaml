apiVersion: v1
kind: Service
metadata:
  name: redis-shared
  namespace: nethub
  labels:
    app: redis-shared
    app.kubernetes.io/name: redis-shared
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  selector:
    app: redis-shared
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
