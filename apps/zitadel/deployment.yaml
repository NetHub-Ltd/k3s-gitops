apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: nethub
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: nethub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        nethub.co.ke/bootstrap: "locked-start-from-setup"
        nethub.co.ke/cache: "redis-db10"
      labels:
        app: zitadel
        app.kubernetes.io/name: zitadel
    spec:
      enableServiceLinks: false
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v2.71.11
          imagePullPolicy: IfNotPresent
          args:
            - start-from-setup
            - --masterkeyFromEnv
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zitadel-config
            - secretRef:
                name: zitadel-secrets
          env:
            - name: ZITADEL_CACHES_CONNECTORS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: zitadel-redis-cache
                  key: url
          resources:
            # Tuned for 3vCPU/8Gi single-node: leave headroom for CNPG + k3s
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: http
              httpHeaders:
                - name: Host
                  value: auth.nethub.co.ke
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: http
              httpHeaders:
                - name: Host
                  value: auth.nethub.co.ke
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
