apiVersion: v1
kind: Service
metadata:
  name: zitadel
  namespace: nethub
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
  annotations:
    # Traefik must speak h2c to Zitadel for gRPC-Web / console API
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  type: ClusterIP
  selector:
    app: zitadel
  ports:
    - name: http
      port: 80
      targetPort: 8080
      appProtocol: http
