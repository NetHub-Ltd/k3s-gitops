apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: nethub
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/part-of: nethub
data:
  ZITADEL_EXTERNALDOMAIN: "auth.nethub.co.ke"
  ZITADEL_EXTERNALPORT: "443"
  ZITADEL_EXTERNALSECURE: "true"
  ZITADEL_TLS_ENABLED: "false"
  ZITADEL_FIRSTINSTANCE_ORG_NAME: "NetHub"
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
  # From address for auth emails (must be allowed in Resend)
  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: "auth@nethub.co.ke"
  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: "NetHub Auth"
  ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: "auth@nethub.co.ke"
