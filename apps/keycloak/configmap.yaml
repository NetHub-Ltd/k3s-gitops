apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: nethub
  labels:
    app.kubernetes.io/name: keycloak
    nethub.co.ke/migrated-from: nethub-cluster
data:
  # Hostname (Keycloak 26 — avoid deprecated hostname-v1-only flags where possible)
  KC_HOSTNAME: "auth.nethub.co.ke"
  KC_HOSTNAME_STRICT: "false"
  KC_HTTP_ENABLED: "true"
  # Behind Traefik / TLS terminator
  KC_PROXY_HEADERS: "xforwarded"
  # Database — required; empty URL deactivates Quarkus datasource and crashes start
  KC_DB: "postgres"
  KC_DB_SCHEMA: "public"
  KC_DB_URL: "jdbc:postgresql://nethub-db-cluster-rw.postgres.svc.cluster.local:5432/keycloak"
  # Observability
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_HTTP_MANAGEMENT_PORT: "9000"
  # Conservative heap on 1Gi limit (leave headroom for non-heap)
  JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30"
