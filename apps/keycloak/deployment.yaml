apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: nethub
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: nethub
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: keycloak
          # Built from NetHub-Ltd/keycloak-config — single image key only (YAML forbids duplicates)
          image: ghcr.io/nethub-ltd/keycloak:0.0.8 # {"$imagepolicy": "flux-system:keycloak"}
          imagePullPolicy: IfNotPresent
          args: ["start"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "500Mi"
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secrets
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
