apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: nethub
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: nethub
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: keycloak
          image: ghcr.io/nethub-ltd/keycloak:0.0.12 # {"$imagepolicy": "flux-system:keycloak"}
          imagePullPolicy: IfNotPresent
          args: ["start", "--optimized"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            # Conservative — low-resource node
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1024Mi"
          envFrom:
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: keycloak-secrets
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 15
            failureThreshold: 6
