apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpay
  namespace: nethub
  labels:
    app: netpay
    app.kubernetes.io/name: netpay
    app.kubernetes.io/part-of: netpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpay
  template:
    metadata:
      labels:
        app: netpay
        app.kubernetes.io/name: netpay
    spec:
      # Same cluster-local pull secret as tawala-api / nethub-api (not managed in this repo).
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: api
          # Flux ImageUpdateAutomation updates this tag when a newer 1.1.x
          # appears on ghcr.io/nethub-ltd/netpay (see clusters/k3s/image-netpay.yaml).
          image: ghcr.io/nethub-ltd/netpay:v1.1.12 # {"$imagepolicy": "flux-system:netpay"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              cpu: "200m"
              memory: "384Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          # App-specific secrets (SOPS) — same pattern as tawala-secrets / nethub-api-secrets
          envFrom:
            - secretRef:
                name: netpay-secrets
          # Shared Redis (single rotation point) — overrides any REDIS_URL in netpay-secrets
          # NetPay only accepts DATABASE_URL (not discrete host/user/pass); that stays in netpay-secrets.
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nethub-redis-app-creds
                  key: url
          # Alembic runs on startup; allow time before probes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
