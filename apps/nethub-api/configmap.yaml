apiVersion: v1
kind: ConfigMap
metadata:
  name: nethub-api-config
  namespace: nethub
  labels:
    app.kubernetes.io/name: nethub-api
    app.kubernetes.io/part-of: nethub
data:
  APP_NAME: "NetHubKe"
  ENVIRONMENT: "production"
  # Comma-separated browser origins for CORS
  ALLOWED_ORIGINS: "https://nethub.co.ke,https://www.nethub.co.ke,https://dev.nethub.co.ke"
  JWT_LEEWAY_SECONDS: "60"
  DIAGNOSTICS_ENABLED: "false"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_USER_ROUTES: "60/minute"
