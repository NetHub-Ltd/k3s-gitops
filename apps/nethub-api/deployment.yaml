apiVersion: apps/v1
kind: Deployment
metadata:
  name: nethub-api
  namespace: nethub
  labels:
    app: nethub-api
    app.kubernetes.io/name: nethub-api
    app.kubernetes.io/part-of: nethub
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nethub-api
  template:
    metadata:
      labels:
        app: nethub-api
        app.kubernetes.io/name: nethub-api
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: api
          # Flux ImageUpdateAutomation updates this tag when a newer 0.0.x
          # appears on ghcr.io/nethub-ltd/nethubke (see clusters/k3s/image-nethubke.yaml).
          image: ghcr.io/nethub-ltd/nethubke:0.0.18 # {"$imagepolicy": "flux-system:nethubke"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              cpu: "250m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          envFrom:
            - secretRef:
                name: nethub-api-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
