apiVersion: apps/v1
kind: Deployment
metadata:
  name: nethub-api
  namespace: nethub
  labels:
    app: nethub-api
    app.kubernetes.io/name: nethub-api
    app.kubernetes.io/part-of: nethub
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nethub-api
  template:
    metadata:
      labels:
        app: nethub-api
        app.kubernetes.io/name: nethub-api
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: api
          # Flux ImageUpdateAutomation updates this tag when a newer 0.0.x
          # appears on ghcr.io/nethub-ltd/nethubke (see clusters/k3s/image-nethubke.yaml).
          image: ghcr.io/nethub-ltd/nethubke:0.0.21 # {"$imagepolicy": "flux-system:nethubke"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              cpu: "200m"
              memory: "384Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          envFrom:
            - secretRef:
                name: nethub-api-secrets
          # Shared DB + Redis override envFrom (single rotation point)
          env:
            - name: FASTAPI_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: host
            - name: FASTAPI_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: port
            - name: FASTAPI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: username
            - name: FASTAPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: password
            - name: FASTAPI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: nethub_db_name
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nethub-redis-app-creds
                  key: url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
