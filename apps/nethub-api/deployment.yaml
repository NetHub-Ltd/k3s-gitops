apiVersion: apps/v1
kind: Deployment
metadata:
  name: nethub-api
  namespace: nethub
  labels:
    app: nethub-api
    app.kubernetes.io/name: nethub-api
    app.kubernetes.io/part-of: nethub
    nethub.co.ke/migrated-from: nethub-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nethub-api
  template:
    metadata:
      labels:
        app: nethub-api
        app.kubernetes.io/name: nethub-api
    spec:
      imagePullSecrets:
        - name: ghcr-registry-key
      containers:
        - name: api
          # Flux ImageUpdateAutomation updates this tag when a newer 0.0.x
          # appears on ghcr.io/nethub-ltd/nethubke (see clusters/k3s/image-nethubke.yaml).
          image: ghcr.io/nethub-ltd/nethubke:0.0.28 # {"$imagepolicy": "flux-system:nethubke"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              cpu: "200m"
              memory: "384Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          envFrom:
            - secretRef:
                name: nethub-api-secrets
            - configMapRef:
                name: nethub-api-config
          # Secrets: OIDC + AUDIENCE from nethub-api-secrets (SOPS).
          # DB: shared nethub-db-app-creds (same cluster; FASTAPI_* names match app Settings).
          env:
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: nethub-api-secrets
                  key: OIDC_ISSUER
            - name: OIDC_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: nethub-api-secrets
                  key: OIDC_JWKS_URL
            - name: AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: nethub-api-secrets
                  key: AUDIENCE
            - name: FASTAPI_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: host
            - name: FASTAPI_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: port
            - name: FASTAPI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: username
            - name: FASTAPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: password
            - name: FASTAPI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: nethub_db_name
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nethub-redis-app-creds
                  key: url
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
