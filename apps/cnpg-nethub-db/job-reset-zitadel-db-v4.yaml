# DEV one-shot: force empty zitadel DB so start-from-init re-bootstraps FirstInstance.
# After successful init + login verification, remove this Job (and v1–v3) from the
# kustomization and switch the Zitadel Deployment off permanent start-from-init.
apiVersion: batch/v1
kind: Job
metadata:
  name: reset-zitadel-db-v4
  namespace: nethub
  labels:
    app.kubernetes.io/name: reset-zitadel-db-v4
    nethub.co.ke/purpose: zitadel-force-clean-init
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: reset-zitadel-db-v4
    spec:
      restartPolicy: OnFailure
      containers:
        - name: reset
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: nethub-db-cluster-rw.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nethub-db-app-creds
                  key: password
            - name: PGDATABASE
              value: postgres
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Force clean init: terminating connections to zitadel..."
              psql -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'zitadel' AND pid <> pg_backend_pid();" || true
              psql -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS zitadel WITH (FORCE);"
              psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE zitadel OWNER nethub_admin;"
              echo "Database zitadel recreated empty (v4 force clean init)."
              echo "Next: restart Zitadel Deployment so start-from-init runs against empty DB."
