---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: nethubke
  namespace: flux-system
spec:
  image: ghcr.io/nethub-ltd/nethubke
  interval: 5m
  secretRef:
    name: ghcr-credentials
  exclusionList:
    - "^.*\\.sig$"
    - "^main$"
    - "^latest$"
    - "^sha-.*$"

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: nethubke
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nethubke
  policy:
    semver:
      # Match NetHubKe CI tags: 0.0.<run_number>
      range: ">=0.0.0 <0.1.0"
