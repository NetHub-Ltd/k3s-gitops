---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tawala-api
  namespace: flux-system
spec:
  image: ghcr.io/nethub-ltd/tawala-api
  interval: 5m
  # Shared GHCR read credentials for all ImageRepositories in flux-system
  secretRef:
    name: ghcr-credentials
  exclusionList:
    - "^.*\\.sig$"
    - "^main$"
    - "^latest$"

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tawala-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tawala-api
  policy:
    semver:
      # Bound the active channel (0.0.x). Do not use unbounded >=0.0.1 when
      # older lines like 0.1.x still exist in GHCR — highest semver would win.
      # When cutting a new minor/major, update this range in the same change window.
      range: ">=0.0.0 <0.1.0"
