---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: keycloak
  namespace: flux-system
spec:
  image: ghcr.io/nethub-ltd/keycloak
  interval: 5m
  secretRef:
    name: ghcr-credentials
  exclusionList:
    - "^.*\\.sig$"
    - "^main$"
    - "^latest$"
    - "^sha-.*$"
    - "^26\\..*"

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: keycloak
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: keycloak
  policy:
    semver:
      # keycloak-config CI: 0.0.<run_number>
      range: ">=0.0.0 <0.1.0"
